openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FutureScape AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scenarios
    description: Scenario management
  - name: simulations
    description: Simulation results
  - name: stats
    description: Dashboard statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /scenarios:
    get:
      operationId: listScenarios
      tags: [scenarios]
      summary: List all scenarios
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scenario"
    post:
      operationId: createScenario
      tags: [scenarios]
      summary: Create a new scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioInput"
      responses:
        "201":
          description: Scenario created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"

  /scenarios/{id}:
    get:
      operationId: getScenario
      tags: [scenarios]
      summary: Get a scenario by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scenario details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scenario"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteScenario
      tags: [scenarios]
      summary: Delete a scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /scenarios/{id}/simulate:
    post:
      operationId: runSimulation
      tags: [simulations]
      summary: Run AI simulation for a scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scenarios/{id}/simulation:
    get:
      operationId: getSimulation
      tags: [simulations]
      summary: Get latest simulation result for a scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /compare:
    post:
      operationId: compareScenarios
      tags: [simulations]
      summary: Compare two scenarios side by side
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareInput"
      responses:
        "200":
          description: Comparison result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonResult"

  /stats/dashboard:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /stats/recent:
    get:
      operationId: getRecentActivity
      tags: [stats]
      summary: Get recent simulation activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /stats/popular:
    get:
      operationId: getPopularScenarios
      tags: [stats]
      summary: Get most simulated scenario categories
      responses:
        "200":
          description: Popular categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryStat"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Scenario:
      type: object
      properties:
        id:
          type: integer
        prompt:
          type: string
        category:
          type: string
        simulationCount:
          type: integer
        hasSimulation:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - prompt
        - category
        - simulationCount
        - hasSimulation
        - createdAt
        - updatedAt

    ScenarioInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 10
        category:
          type: string
      required:
        - prompt
        - category

    TimelineEvent:
      type: object
      properties:
        year:
          type: integer
        title:
          type: string
        description:
          type: string
        severity:
          type: string
      required:
        - year
        - title
        - description
        - severity

    DomainImpact:
      type: object
      properties:
        domain:
          type: string
        score:
          type: integer
        trend:
          type: string
        summary:
          type: string
        predictions:
          type: array
          items:
            type: string
      required:
        - domain
        - score
        - trend
        - summary
        - predictions

    NewsHeadline:
      type: object
      properties:
        year:
          type: integer
        headline:
          type: string
        source:
          type: string
        category:
          type: string
      required:
        - year
        - headline
        - source
        - category

    ButterflyNode:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        depth:
          type: integer
        children:
          type: array
          items:
            type: string
      required:
        - id
        - label
        - description
        - depth
        - children

    AlternateRealityScore:
      type: object
      properties:
        survivalProbability:
          type: integer
        economicStability:
          type: integer
        humanHappiness:
          type: integer
        technologicalAdvancement:
          type: integer
        environmentalRisk:
          type: integer
        overallScore:
          type: integer
      required:
        - survivalProbability
        - economicStability
        - humanHappiness
        - technologicalAdvancement
        - environmentalRisk
        - overallScore

    SimulationResult:
      type: object
      properties:
        id:
          type: integer
        scenarioId:
          type: integer
        summary:
          type: string
        probabilityScore:
          type: integer
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEvent"
        domainImpacts:
          type: array
          items:
            $ref: "#/components/schemas/DomainImpact"
        newsHeadlines:
          type: array
          items:
            $ref: "#/components/schemas/NewsHeadline"
        butterflyNodes:
          type: array
          items:
            $ref: "#/components/schemas/ButterflyNode"
        scores:
          $ref: "#/components/schemas/AlternateRealityScore"
        createdAt:
          type: string
      required:
        - id
        - scenarioId
        - summary
        - probabilityScore
        - timeline
        - domainImpacts
        - newsHeadlines
        - butterflyNodes
        - scores
        - createdAt

    CompareInput:
      type: object
      properties:
        scenarioIdA:
          type: integer
        scenarioIdB:
          type: integer
      required:
        - scenarioIdA
        - scenarioIdB

    ComparisonResult:
      type: object
      properties:
        scenarioA:
          $ref: "#/components/schemas/Scenario"
        scenarioB:
          $ref: "#/components/schemas/Scenario"
        simulationA:
          $ref: "#/components/schemas/SimulationResult"
        simulationB:
          $ref: "#/components/schemas/SimulationResult"
        verdict:
          type: string
        winner:
          type: string
      required:
        - scenarioA
        - scenarioB
        - simulationA
        - simulationB
        - verdict
        - winner

    DashboardStats:
      type: object
      properties:
        totalScenarios:
          type: integer
        totalSimulations:
          type: integer
        avgProbabilityScore:
          type: integer
        topCategory:
          type: string
        scenariosToday:
          type: integer
      required:
        - totalScenarios
        - totalSimulations
        - avgProbabilityScore
        - topCategory
        - scenariosToday

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        prompt:
          type: string
        category:
          type: string
        probabilityScore:
          type: ["integer", "null"]
        createdAt:
          type: string
      required:
        - id
        - prompt
        - category
        - probabilityScore
        - createdAt

    CategoryStat:
      type: object
      properties:
        category:
          type: string
        count:
          type: integer
        avgScore:
          type: integer
      required:
        - category
        - count
        - avgScore
